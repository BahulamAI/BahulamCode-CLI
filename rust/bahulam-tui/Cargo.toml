[package]
name = "bahulam-tui"
version = "0.2.6-beta.2"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["terminal-queries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4.19.0"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
ratatui-image = { version = "=11.1.0", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
